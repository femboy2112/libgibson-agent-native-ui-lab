[package]
name = "project-theseus"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
gibson = { package = "libgibson", git = "https://github.com/femboy2112/libgibson", tag = "v0.4.0", features = ["audio-cpal"] }
rand = "0.8"

[dev-dependencies]
portable-pty = "0.9"

# The reactor rasterizes every frame with transcendental-heavy per-pixel math.
# Even at `opt-level = 1` this app is ~10x faster than the unoptimized dev
# default, which keeps the interactive loop and the PTY harness responsive while
# preserving fast incremental compiles.
[profile.dev]
opt-level = 1
