[package]
name = "project-pulsar"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Project Pulsar — a deterministic synthetic deep-space signal observatory built on gibson::plot"

[lib]
name = "pulsar"
path = "src/lib.rs"

[[bin]]
name = "project-pulsar"
path = "src/main.rs"

# LibGibson is pinned to an EXACT candidate revision (a git rev, not a branch).
# Do not change this pin, do not add a path override.
[dependencies]
libgibson = { git = "https://github.com/femboy2112/libgibson", rev = "8d69c0143c9fd6992be22c23020f9f1f744db627" }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"
libc = "0.2"

# The observatory does real DSP (FFTs, dechirp search) on every checkpoint; an
# unoptimised debug build makes `cargo test` and interactive playback needlessly
# slow. Optimise the dev/test profile (debug assertions stay on).
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
