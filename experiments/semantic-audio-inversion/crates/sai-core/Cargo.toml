[package]
name = "sai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sai_core"
path = "src/lib.rs"

[[bin]]
name = "sai"
path = "src/bin/sai.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
